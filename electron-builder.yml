appId: com.friday.recorder
productName: Friday Recorder
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
